<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connections · Angels Knoll</title>
<link rel="stylesheet" href="../site.css">
<script src="../theme.js"></script>
<style>
  /* Connections only; colours and type come from site.css. A 3D network of the research entries (data.json, built by
     docs/connections_build.py): height is time (user, 2026-10-12), the other two directions are free. Only links
     that are in the data are drawn; each one says why. */
  html, body { height: 100%; overflow: hidden; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; }
  .over { position: fixed; left: 16px; top: 16px; max-width: 420px; pointer-events: none; z-index: 3; }
  .over .eyebrow { margin-bottom: 8px; pointer-events: auto; }
  .over h1 { font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 6px; }
  .over .subtitle { font-size: 0.85rem; }
  .search { margin-top: 12px; pointer-events: auto; width: min(320px, calc(100vw - 32px)); }
  .search input { width: 100%; font: 0.8rem var(--font); color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 9px; outline: none; transition: border-color var(--t-feedback); }
  .search input:focus { border-color: var(--muted); }
  .search ul { list-style: none; margin-top: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; }
  .search ul:empty { display: none; }
  .search li { padding: 5px 9px; font-size: 0.78rem; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .search li.on, .search li:hover { background: var(--hover); }
  .search li small { font: 0.62rem var(--mono); color: var(--faint); flex: none; }
  .search li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the mini timeline in the card of a person, organisation or subject */
  .card .mini { width: 100%; height: 44px; display: block; margin: 4px 0 2px; overflow: visible; }
  .card .mini line { stroke: var(--line); }
  .card .mini circle { cursor: pointer; transition: r var(--t-feedback); }
  .card .mini circle:hover { r: 5; }
  .card .mini text { font: 0.6rem var(--mono); fill: var(--faint); }
  /* the box of the controls lets the pointer through; only its buttons and open panel take it (user, 2026-10-12: points
     behind the controls' box could not be picked) */
  .ctl { position: fixed; left: 16px; bottom: 16px; z-index: 3; font-size: 0.75rem; color: var(--muted); max-width: calc(100% - 90px);
    pointer-events: none; }
  .ctl button, .ctl .panel.show { pointer-events: auto; }
  .ctl .bar { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
  .ctl .bar [data-open]::after { content: "▴"; font-size: 0.6rem; margin-left: 4px; opacity: 0.6; }
  .ctl .bar [data-open].on::after { content: "▾"; }
  .ctl .bar .sep { color: var(--line); }
  .ctl .panel { display: none; width: min(460px, calc(100vw - 32px)); max-height: 52vh; overflow: auto; margin-bottom: 10px;
    padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; }
  .ctl .panel.show { display: block; animation: panelIn var(--t-in) ease both; }
  @keyframes panelIn { from { opacity: 0; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
  .ctl .panel .key { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .ctl .panel dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; }
  .ctl .panel dt { font: 0.68rem var(--mono); color: var(--text); }
  .ctl .panel dd { color: var(--muted); }
  .ctl button { font: inherit; color: var(--faint); background: none; border: 0; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: color var(--t-feedback); }
  .ctl button:hover { color: var(--text); }
  .ctl button.on { color: var(--text); }
  .ctl button i { display: inline-block; width: 16px; height: 0; border-top: 1px solid currentColor; opacity: .35; }
  .ctl button.on i { opacity: 1; }
  .ctl .key { color: var(--muted); }
  .ctl .key span { display: inline-flex; align-items: center; gap: 5px; }
  /* tag samples in the key, drawn like the tags in the view */
  .ctl .tk { font-size: 0.6rem; line-height: 1.2; padding: 1px 4px; border-radius: 2px; font-weight: 600; }
  .ctl .tk.hub { background: var(--text); color: var(--bg); }
  .ctl .tk.hub:first-of-type { text-transform: uppercase; letter-spacing: 0.06em; }
  .ctl .tk.subj { border: 1px solid var(--muted); color: var(--muted); font-style: italic; font-weight: 400; }
  .ctl .tk.dimk { opacity: 0.18; }
  .ctl .tk.selk { background: var(--verified); color: var(--bg); }
  .ctl .abbr-h { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin: 12px 0 6px; }

  /* labels drawn over the canvas */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 0.78rem; line-height: 1.2; will-change: transform;
    transition: opacity var(--t-in) ease; }
  .lb.hub { padding: 2px 5px; border-radius: 2px; background: var(--text); color: var(--bg); font-weight: 600; }
  .lb.hub.org { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.68rem; }
  .lb.subject { padding: 1px 5px; border: 1px solid var(--muted); color: var(--muted); background: var(--bg); font-style: italic; border-radius: 2px; }
  .lb.entry { color: var(--text); max-width: 230px; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); }
  .lb.entry.sel { background: var(--c); color: var(--bg); padding: 2px 5px; border-radius: 2px; text-shadow: none; max-width: 300px; }
  .lb[data-i] { pointer-events: auto; cursor: grab; }
  /* while the slider is held, nothing else reacts to the pointer and the pointer keeps its look (user, 2026-10-12) */
  body.scanning, body.scanning * { cursor: default !important; }
  body.scanning .lb[data-i] { pointer-events: none; }
  .lb.dim { pointer-events: none; }
  .lb .rd { display: block; font: 0.64rem/1.25 var(--mono); letter-spacing: 0.02em; font-weight: 400; text-transform: none; font-style: normal; opacity: 0.7; }
  .lb .rd:empty { display: none; }
  .lb .tt { display: block; overflow: hidden; text-overflow: ellipsis; }
  .lb.year { font: 0.7rem var(--mono); color: var(--faint); }
  .lb.dim { opacity: 0.18; }
  .lb.off { opacity: 0; pointer-events: none; }
  .blob.out { animation: blobOut var(--t-in) ease-in both; }
  @keyframes blobOut { from { opacity: 1; } to { opacity: 0; scale: 1.4; } }
  /* blob tracking (user, 2026-10-12, after TouchDesigner's Blob Track): the point in focus and its neighbours get a
     tracking frame that locks on and follows them, with a small readout; the chosen one gets a full square */
  #blobs { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .blob { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); will-change: translate;
    --k: var(--text); --l: 5px;
    background: linear-gradient(var(--k), var(--k)) top left / var(--l) 1px, linear-gradient(var(--k), var(--k)) top left / 1px var(--l),
      linear-gradient(var(--k), var(--k)) top right / var(--l) 1px, linear-gradient(var(--k), var(--k)) top right / 1px var(--l),
      linear-gradient(var(--k), var(--k)) bottom left / var(--l) 1px, linear-gradient(var(--k), var(--k)) bottom left / 1px var(--l),
      linear-gradient(var(--k), var(--k)) bottom right / var(--l) 1px, linear-gradient(var(--k), var(--k)) bottom right / 1px var(--l);
    background-repeat: no-repeat; }
  .blob i { display: none; position: absolute; right: calc(100% + 3px); top: calc(100% - 2px); text-align: right; font: 0.56rem/1 var(--mono); color: var(--muted);
    white-space: nowrap; font-style: normal; letter-spacing: 0.02em; }
  .blob.main { border: 1px solid var(--k); background: none; }
  .blob.main i { color: var(--text); }
  /* scanning: a slider thumb on the time axis itself (user, 2026-10-12: no second line across); dragging it frames
     the entries of that time. Its readout sits to the left, clear of the years. */
  /* the slider is a capsule in the scene (user, 2026-10-12: solid and 3D, as the view turns); only its readout is HTML */
  #scanrd { position: fixed; left: 0; top: 0; z-index: 3; text-align: right; pointer-events: none; will-change: translate;
    font: 0.68rem/1.3 var(--mono); color: var(--text); white-space: nowrap; transform: translate(-100%, -50%); opacity: 0;
    transition: opacity var(--t-feedback); }
  #scanrd.on { opacity: 1; }
  #scanrd b { font-size: 0.95rem; font-weight: 400; display: block; }
  /* locking on: the frame closes in from larger (scale, not transform, which holds the position) */
  .blob { animation: lockOn var(--t-in) ease-out both; }
  @keyframes lockOn { from { opacity: 0; scale: 2.2; } to { opacity: 1; scale: 1; } }

  .card { position: fixed; right: 16px; top: 16px; bottom: 64px; width: 360px; overflow: auto; background: var(--bg);
    border: 1px solid var(--line); border-radius: 3px; padding: 16px 18px; font-size: 0.85rem; z-index: 4;
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity var(--t-in) ease, transform var(--t-in) ease; }
  .card.show { opacity: 1; transform: none; pointer-events: auto; }
  .card .meta { font: 0.68rem var(--mono); color: var(--faint); margin-bottom: 6px; }
  .card h3 { font-size: 1rem; line-height: 1.35; margin-bottom: 8px; padding-right: 16px; }
  .card p { color: var(--muted); margin-bottom: 10px; }
  .card .st { font-weight: 700; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .card .st.verified { color: var(--verified); } .card .st.unverified { color: var(--unverified); }
  .card .st.open-question { color: var(--question); } .card .st.analysis { color: var(--analysis); }
  .card .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--faint); font-size: 1.1rem; cursor: pointer; }
  .card a { color: var(--text); }
  .card h4 { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint);
    margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .card ul { list-style: none; }
  .card li { margin-bottom: 9px; }
  .card li button { font: inherit; font-weight: 600; color: var(--text); background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; transition: text-decoration-color var(--t-feedback); }
  .card li button:hover { text-decoration-color: currentColor; }
  .card li .why { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }

  #view, .over, .ctl { transition: opacity var(--t-out) ease; }
  body:not(.ready) #view, body:not(.ready) .ctl, body:not(.ready) #labels { opacity: 0; }
  @media (max-width: 600px) {
    .over h1 { font-size: 1.3rem; }
    .over .subtitle { display: none; }
    .card { left: 16px; right: 16px; width: auto; top: auto; max-height: 55vh; bottom: 60px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>
<div id="blobs"></div>
<div id="scanrd"></div>
<div id="labels"></div>
<div class="over">
  <p class="eyebrow">Angels Knoll · Connections · <a href="../" class="home">home</a></p>
  <h1>Connections</h1>
  <p class="subtitle">How the research entries are linked. Up is later in time.</p>
  <div class="search"><input id="q" type="search" placeholder="Search people, places, entries" autocomplete="off" spellcheck="false">
    <ul id="qres"></ul></div>
</div>
<div class="ctl" id="ctl"></div>
<div class="card" id="card" role="dialog" aria-live="polite"></div>
<button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">&#9680;</button>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const STATUS = { verified: "Verified", unverified: "Unverified", "open-question": "Open question", analysis: "Analysis" };
const KINDS = [   // drawn in this order; source is off at first (user, 2026-10-12)
  { k: "mention", label: "Mentions another entry", on: true, a: 0.6 },
  { k: "actor", label: "Names a person or organisation", on: true, a: 0.28 },
  { k: "subject", label: "Media subject (our grouping)", on: true, a: 0.22 },
  { k: "source", label: "Same source", on: false, a: 0.1 },
];
const FAINT_HUB = { "actor:city": 0.3 };   // the City is in 50 entries: kept, drawn fainter (user, 2026-10-12)
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (d) => {
  if (!d) return ""; if (d === "present") return "present";
  const [y, m, dd] = d.split("-");
  return !m ? y : !dd ? `${MON[+m - 1]} ${y}` : `${MON[+m - 1]} ${+dd}, ${y}`;
};
const num = (d) => { const [y, m, dd] = d.split("-").map(Number); return y + ((m || 1) - 1) / 12 + ((dd || 1) - 1) / 365; };

let data, research;
try {
  [data, research] = await Promise.all([fetch("data.json").then((r) => r.json()), fetch("../research/data.json").then((r) => r.json())]);
} catch (e) {
  document.querySelector(".over .subtitle").textContent = "Could not load the data. Open the site through a local server (python web/serve.py).";
  document.body.classList.add("ready");
  throw e;
}
const finding = new Map(research.findings.map((f) => [f.id, f]));
const nodes = data.nodes, N = nodes.length;
const byId = new Map(nodes.map((n, i) => [n.id, i]));
const links = data.links.map((l) => ({ ...l, i: byId.get(l.a), j: byId.get(l.b) })).filter((l) => l.i !== undefined && l.j !== undefined);
const adj = nodes.map(() => []);
links.forEach((l, li) => { adj[l.i].push(li); adj[l.j].push(li); });
const isHub = (n) => n.type !== "entry";

// ---- layout: height is time for dated entries; a seeded force layout for the rest, computed once ----
const H = 1100;   // taller than first drawn (640), so the years and the entries of one year sit further apart (user, 2026-10-12)
const dated = nodes.filter((n) => n.type === "entry" && n.start).map((n) => num(n.start)).sort((a, b) => a - b);
const t0 = dated[0], t1 = Math.max(dated[dated.length - 1], num(data.asOf || "2026-10-12"));
function yOf(t) {     // part linear, mostly by rank: the quiet decades stay short, the busy years open up
  let lo = 0, hi = dated.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (dated[m] < t) lo = m + 1; else hi = m; }
  const rank = lo / (dated.length - 1);
  return H * (0.3 * (t - t0) / (t1 - t0) + 0.7 * rank) - H / 2;
}
const P = new Float32Array(N * 3), V = new Float32Array(N * 3), fixY = new Array(N).fill(null);
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
nodes.forEach((n, i) => {
  const a = rnd() * Math.PI * 2, r = 160 + rnd() * 520;
  P[3 * i] = Math.cos(a) * r; P[3 * i + 2] = Math.sin(a) * r;
  if (n.type === "entry" && n.start) { fixY[i] = yOf(num(n.start)); P[3 * i + 1] = fixY[i]; }
  else P[3 * i + 1] = (rnd() - 0.5) * H * 0.6;
  n.deg = adj[i].filter((li) => links[li].kind !== "source").length;
});
const layoutLinks = links.filter((l) => l.kind !== "source");
const SPRING = { mention: [100, 0.05], actor: [160, 0.025], subject: [120, 0.04] };   // lengths grew with the taller axis
// one step of the forces; pinned nodes (dragged or dropped) stay where they are
const pinned = new Set();
function tick(cool) {
  V.fill(0);
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    let dx = P[3 * i] - P[3 * j], dy = P[3 * i + 1] - P[3 * j + 1], dz = P[3 * i + 2] - P[3 * j + 2];
    let d2 = dx * dx + dy * dy + dz * dz + 1;
    if (d2 > 1000000) continue;
    const f = Math.min(16000 / d2, 10), d = Math.sqrt(d2);
    dx *= f / d; dy *= f / d; dz *= f / d;
    V[3 * i] += dx; V[3 * i + 1] += dy; V[3 * i + 2] += dz; V[3 * j] -= dx; V[3 * j + 1] -= dy; V[3 * j + 2] -= dz;
  }
  for (const l of layoutLinks) {
    const [len, k0] = SPRING[l.kind], k = k0 * (FAINT_HUB[l.a] || FAINT_HUB[l.b] || 1);
    const i = l.i, j = l.j;
    const dx = P[3 * j] - P[3 * i], dy = P[3 * j + 1] - P[3 * i + 1], dz = P[3 * j + 2] - P[3 * i + 2];
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz) + 0.01, f = k * (d - len) / d;
    V[3 * i] += dx * f; V[3 * i + 1] += dy * f; V[3 * i + 2] += dz * f; V[3 * j] -= dx * f; V[3 * j + 1] -= dy * f; V[3 * j + 2] -= dz * f;
  }
  for (let i = 0; i < N; i++) {
    if (pinned.has(i)) continue;
    const n = nodes[i], x = P[3 * i], z = P[3 * i + 2], r = Math.hypot(x, z) + 0.01;
    V[3 * i] -= x * 0.0011; V[3 * i + 2] -= z * 0.0011;                     // toward the time axis
    if (n.type === "entry" && !n.start && r < 700) { V[3 * i] += x / r * 1.5; V[3 * i + 2] += z / r * 1.5; }   // undated: an outer shell
    for (let c = 0; c < 3; c++) P[3 * i + c] += Math.max(-8, Math.min(8, V[3 * i + c])) * cool;
    if (fixY[i] !== null) P[3 * i + 1] = fixY[i];
    else P[3 * i + 1] = Math.max(-H / 2 - 40, Math.min(H / 2 + 40, P[3 * i + 1]));
  }
}
for (let it = 0; it < 420; it++) tick(1 - it / 420);
const P0 = P.slice();   // the settled layout, for Reset

// ---- scene ----
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 1, 6000);
camera.position.set(2050, 260, 2050);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 0.26;   // one turn in about 3.8 minutes (was 0.35; user, 2026-10-13: a quarter slower)
controls.minDistance = 120; controls.maxDistance = 4400;

// colours from the page's variables (they ease when the theme changes)
const css = {};
function readColours() {
  const s = getComputedStyle(document.documentElement);
  for (const v of ["bg", "text", "muted", "faint", "line", "verified", "unverified", "question", "analysis"]) css[v] = new THREE.Color(s.getPropertyValue("--" + v).trim() || "#888");
}
readColours();
const statusColour = (n) => n.type === "entry" ? css[{ "open-question": "question" }[n.status] || n.status] || css.muted : n.type === "subject" ? css.muted : css.text;

// nodes: one Points object; size, colour, alpha and shape per node
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute("position", new THREE.BufferAttribute(P, 3));
const pCol = new Float32Array(N * 4), pSize = new Float32Array(N), pShape = new Float32Array(N);
nodes.forEach((n, i) => {
  pSize[i] = n.type === "entry" ? 5 + Math.sqrt(n.deg + n.nsrc) * 1.6 : 7 + Math.sqrt(n.deg) * 1.4;
  pShape[i] = n.type === "entry" ? (n.start ? 0 : 2) : n.type === "subject" ? 3 : 1;   // disc (dated), ring (no date), square, diamond
});
pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 4));
pGeo.setAttribute("size", new THREE.BufferAttribute(pSize, 1));
pGeo.setAttribute("shape", new THREE.BufferAttribute(pShape, 1));
const pMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { scale: { value: 1 } },
  vertexShader: `attribute float size; attribute float shape; attribute vec4 color; varying vec4 vC; varying float vS;
    uniform float scale;
    void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;
      gl_PointSize = size * scale / -mv.z; vC = color; vS = shape;
      vC.a *= clamp(1.35 - (-mv.z) / 4200.0, 0.35, 1.0); }`,
  fragmentShader: `varying vec4 vC; varying float vS;
    void main() { vec2 p = gl_PointCoord - 0.5; float d = length(p);
      if (vS < 0.5) { if (d > 0.5) discard; }
      else if (vS < 1.5) { if (max(abs(p.x), abs(p.y)) > 0.42) discard; }
      else if (vS < 2.5) { if (d > 0.5 || d < 0.3) discard; }
      else { if (abs(p.x) + abs(p.y) > 0.5) discard; }
      gl_FragColor = vC; }`,
});
scene.add(new THREE.Points(pGeo, pMat));

// links: one LineSegments object, rgba per vertex
// links are curves (user, 2026-10-13: freer, more graceful than one fixed bow). Links of a person, organisation or
// subject leave it together, towards the middle of everything it is tied to, and part only further out, so each
// reads as a sheaf; links between two entries each get their own bow, turned and sized by a fixed seed. Cubic curves
// in SEG pieces.
const SEG = 14;
const lPos = new Float32Array(links.length * SEG * 6), lCol = new Float32Array(links.length * SEG * 8);
const linkSeed = links.map((l, k) => { const x = Math.sin((k + 1) * 12.9898) * 43758.5453; return x - Math.floor(x); });
const hubMid = new Float32Array(N * 3);   // per node: the mean position of its neighbours (bundles leave towards it)
function arcs() {
  hubMid.fill(0);
  const cnt = new Uint16Array(N);
  for (const l of links) {

  for (const [i, el] of blobs) {
    const h = +el.dataset.h;
    if (scr[3 * i + 2] > 1) { el.style.visibility = "hidden"; continue; }
    el.style.visibility = "";
    el.style.translate = `${(scr[3 * i] - h).toFixed(1)}px ${(scr[3 * i + 1] - h).toFixed(1)}px`;   // not transform: scale (lock-on) must act about the frame's own centre
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const h0 = decodeURIComponent(location.hash.slice(1));
if (byId.has(h0)) select(byId.get(h0), true);
requestAnimationFrame(() => document.body.classList.add("ready"));
</script>
